name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Actions secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          echo "--- file info ---"
          ls -la android/app/release.jks
          file android/app/release.jks
          echo "--- env info ---"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS: $KEY_ALIAS"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "--- keytool output ---"
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          echo "--- exit code above ---"

      - name: Verify signing env
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH:     release.jks
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease

      - name: Verify AAB is signed
        run: |
          set -euo pipefail
          cd android
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          python3 - "$AAB" <<'PY'
          import re
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as bundle:
              names = bundle.namelist()
          has_signature_block = any(re.fullmatch(r"META-INF/[^/]+\.(RSA|DSA|EC)", name, re.I) for name in names)
          has_signature_file = any(re.fullmatch(r"META-INF/[^/]+\.SF", name, re.I) for name in names)
          if not (has_signature_block and has_signature_file):
              raise SystemExit("AAB is unsigned: JAR signature files are missing")
          PY
          if ! verification=$(jarsigner -verify -verbose -certs "$AAB" 2>&1); then
            printf '%s\n' "$verification"
            echo "::error::AAB signature verification failed"
            exit 1
          fi
          printf '%s\n' "$verification"
          if ! printf '%s\n' "$verification" | grep -qi 'jar verified\.'; then
            echo "::error::jarsigner did not confirm that the AAB is signed"
            exit 1
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
